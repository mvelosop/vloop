# The [[check]] below runs cmd/vloop's ~9-minute package; the default 15 would
# leave it no headroom (B11 owns the suite's speed).
run.gate-timeout = 30

# This repository is worked on from macOS and Windows: checks and gates run in
# pwsh everywhere (issue #156).
shell = "pwsh"

[metrics]
  code = ["internal/brief/templates/**", "schemas/**"]
  # The plugin's eval cases are the skills' tests: graders, prompts, briefs and
  # scaffolds alike (the go preset would count their .md as docs, the rest as other).
  test = ["plugin/evals/**", "tools/eval-preflight/**"]
  stacks = ["go"]

# The repository's tests and health checks — CLAUDE.md's toolchain — run by the
# driver on the base, after every iteration, and once in full at the end.
# tools/check runs them in Go, so the check is the same in any shell.
[[check]]
  name = "go"
  paths = ["**"]
  run = "go run ./tools/check"
